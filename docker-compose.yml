services:
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: securevms-web
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./app:/app
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
      - MYSQL_DATABASE=securevms
    depends_on:
      db:
        condition: service_healthy
    networks:
      - securevms-network
    restart: always

  db:
    image: mysql:8.0
    container_name: securevms-db
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=securevms
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - securevms-network
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:

networks:
  securevms-network:
    driver: bridge