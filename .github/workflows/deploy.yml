name: Build and Push Docker Image

# When this workflow runs
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

# What this workflow does
jobs:
  build-and-push:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3
      
      # Step 2: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      # Step 3: Build the Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/securevms-web:latest ./app
          docker tag ${{ secrets.DOCKER_USERNAME }}/securevms-web:latest ${{ secrets.DOCKER_USERNAME }}/securevms-web:${{ github.sha }}
      
      # Step 4: Push to Docker Hub
      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/securevms-web:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/securevms-web:${{ github.sha }}
      
      # Step 5: Deploy (optional - if you have a server)
      # - name: Deploy to Server
      #   run: |
      #     ssh user@server "docker pull ${{ secrets.DOCKER_USERNAME }}/securevms-web:latest && docker-compose up -d"